worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Logging format
    log_format loadbalancer '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            'upstream: $upstream_addr '
                            'request_time: $request_time';

    access_log /var/log/nginx/access.log loadbalancer;
    error_log  /var/log/nginx/error.log warn;

    # -------------------------------------------------------------
    # Upstream: API Gateway Cluster (Two Replicas with Health Checks)
    # -------------------------------------------------------------
    upstream api_gateway_cluster {
        server gateway-service-1:8000 max_fails=3 fail_timeout=10s;
        server gateway-service-2:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Custom verification headers
        add_header X-Load-Balancer "Nginx" always;
        add_header X-Upstream-Server $upstream_addr always;

        # -------------------------------------------------------------
        # Nginx Edge Health Check
        # -------------------------------------------------------------
        location = /nginx-health {
            return 200 '{"status":"UP","service":"nginx-edge","upstream":["gateway-service-1:8000","gateway-service-2:8000"]}';
        }

        # -------------------------------------------------------------
        # Forward All Requests (including /health and /api/*) to the Gateway Cluster
        # -------------------------------------------------------------
        location / {
            proxy_pass http://api_gateway_cluster;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
