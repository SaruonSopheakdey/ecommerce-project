worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Logging
    log_format loadbalancer '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            'upstream: $upstream_addr '
                            'request_time: $request_time';

    access_log /var/log/nginx/access.log loadbalancer;
    error_log  /var/log/nginx/error.log warn;

    # -------------------------------------------------------------
    # Upstream 1: Product Catalog Cluster (Round-Robin Load Balancer)
    # -------------------------------------------------------------
    upstream product_service_cluster {
        server product-service-1:8003;
        server product-service-2:8003;
    }

    # -------------------------------------------------------------
    # Upstream 2: Review & Rating Cluster (Round-Robin Load Balancer)
    # -------------------------------------------------------------
    upstream review_service_cluster {
        server review-service-1:8007;
        server review-service-2:8007;
    }

    server {
        listen 80;
        server_name localhost;

        # Add custom headers to prove Nginx is the active load balancer
        add_header X-Load-Balancer "Nginx" always;
        add_header X-Upstream-Server $upstream_addr always;

        # -------------------------------------------------------------
        # Health Check Endpoint
        # -------------------------------------------------------------
        location /health {
            return 200 '{"status":"UP","service":"nginx-load-balancer","loadBalancing":{"products":["product-service-1:8003","product-service-2:8003"],"reviews":["review-service-1:8007","review-service-2:8007"]}}';
            add_header Content-Type application/json;
        }

        # -------------------------------------------------------------
        # 1. Product Catalog Service (Load Balanced via Nginx)
        # -------------------------------------------------------------
        location /api/products {
            proxy_pass http://product_service_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # 2. Review & Rating Service (Load Balanced via Nginx)
        # -------------------------------------------------------------
        location /api/reviews {
            proxy_pass http://review_service_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # 3. Auth Service
        # -------------------------------------------------------------
        location /api/auth {
            proxy_pass http://auth-service:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -------------------------------------------------------------
        # 4. Inventory Service
        # -------------------------------------------------------------
        location /api/inventory {
            proxy_pass http://inventory-service:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -------------------------------------------------------------
        # 5. Cart Service
        # -------------------------------------------------------------
        location /api/cart {
            proxy_pass http://cart-service:8005;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -------------------------------------------------------------
        # 6. Order Service
        # -------------------------------------------------------------
        location /api/orders {
            proxy_pass http://order-service:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -------------------------------------------------------------
        # 7. Notification / Email Service
        # -------------------------------------------------------------
        location /api/notifications {
            proxy_pass http://notification-service:8008;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
