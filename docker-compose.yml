services:
  # ----------------------------------------------------
  # Nginx Load Balancer & Reverse Proxy (Port 80)
  # ----------------------------------------------------
  nginx-loadbalancer:
    build: ./nginx
    container_name: nginx-loadbalancer
    restart: always
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - product-service-1
      - product-service-2
      - inventory-service
      - cart-service
      - order-service
      - review-service-1
      - review-service-2
      - notification-service

  # ----------------------------------------------------
  # MongoDB Database Service
  # ----------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: ecommerce-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # ----------------------------------------------------
  # Auth Service (Port 8001)
  # ----------------------------------------------------
  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - MONGO_URI=mongodb://mongo:27017/userdb
      - JWT_SECRET=supersecretkey123
    depends_on:
      - mongo

  # ----------------------------------------------------
  # Product Catalog Service - Instance 1 (Port 8003) [Nginx Load Balanced]
  # ----------------------------------------------------
  product-service-1:
    build: ./product-service
    container_name: product-service-1
    restart: always
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - INSTANCE_ID=product-instance-8003
      - MONGO_URI=mongodb://mongo:27017/productdb
      - JWT_SECRET=supersecretkey123
    depends_on:
      - mongo

  # ----------------------------------------------------
  # Product Catalog Service - Instance 2 (Port 8013) [Nginx Load Balanced]
  # ----------------------------------------------------
  product-service-2:
    build: ./product-service
    container_name: product-service-2
    restart: always
    ports:
      - "8013:8003"
    environment:
      - PORT=8003
      - INSTANCE_ID=product-instance-8013
      - MONGO_URI=mongodb://mongo:27017/productdb
      - JWT_SECRET=supersecretkey123
    depends_on:
      - mongo

  # ----------------------------------------------------
  # Inventory Service (Port 8004)
  # ----------------------------------------------------
  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    restart: always
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - MONGO_URI=mongodb://mongo:27017/inventorydb
      - JWT_SECRET=supersecretkey123
    depends_on:
      - mongo

  # ----------------------------------------------------
  # Cart Service (Port 8005)
  # ----------------------------------------------------
  cart-service:
    build: ./cart-service
    container_name: cart-service
    restart: always
    ports:
      - "8005:8005"
    environment:
      - PORT=8005
      - MONGO_URI=mongodb://mongo:27017/cartdb
      - JWT_SECRET=supersecretkey123
    depends_on:
      - mongo

  # ----------------------------------------------------
  # Order Service (Port 8002)
  # ----------------------------------------------------
  order-service:
    build: ./order-service
    container_name: order-service
    restart: always
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - MONGO_URI=mongodb://mongo:27017/orderdb
      - JWT_SECRET=supersecretkey123
    depends_on:
      - mongo

  # ----------------------------------------------------
  # Review & Rating Service - Instance 1 (Port 8007) [Nginx Load Balanced]
  # ----------------------------------------------------
  review-service-1:
    build: ./review-service
    container_name: review-service-1
    restart: always
    ports:
      - "8007:8007"
    environment:
      - PORT=8007
      - INSTANCE_ID=review-instance-8007
      - MONGO_URI=mongodb://mongo:27017/reviewdb
      - JWT_SECRET=supersecretkey123
    depends_on:
      - mongo

  # ----------------------------------------------------
  # Review & Rating Service - Instance 2 (Port 8017) [Nginx Load Balanced]
  # ----------------------------------------------------
  review-service-2:
    build: ./review-service
    container_name: review-service-2
    restart: always
    ports:
      - "8017:8007"
    environment:
      - PORT=8007
      - INSTANCE_ID=review-instance-8017
      - MONGO_URI=mongodb://mongo:27017/reviewdb
      - JWT_SECRET=supersecretkey123
    depends_on:
      - mongo

  # ----------------------------------------------------
  # Notification & Email Service (Port 8008)
  # ----------------------------------------------------
  notification-service:
    build: ./notification-service
    container_name: notification-service
    restart: always
    ports:
      - "8008:8008"
    environment:
      - PORT=8008
      - MONGO_URI=mongodb://mongo:27017/notificationdb
      - JWT_SECRET=supersecretkey123
    depends_on:
      - mongo

  # ----------------------------------------------------
  # API Gateway (Port 8000)
  # ----------------------------------------------------
  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AUTH_SERVICE_URL=http://auth-service:8001
      - PRODUCT_SERVICE_URLS=http://product-service-1:8003,http://product-service-2:8003
      - INVENTORY_SERVICE_URL=http://inventory-service:8004
      - CART_SERVICE_URL=http://cart-service:8005
      - ORDER_SERVICE_URL=http://order-service:8002
      - REVIEW_SERVICE_URLS=http://review-service-1:8007,http://review-service-2:8007
      - NOTIFICATION_SERVICE_URL=http://notification-service:8008
    depends_on:
      - auth-service
      - product-service-1
      - product-service-2
      - inventory-service
      - cart-service
      - order-service
      - review-service-1
      - review-service-2
      - notification-service

volumes:
  mongo-data:
